name: Compilar y publicar firmware
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Headers privados
        run: |
          printf '#pragma once\n#define WIFI_SSID "%s"\n#define WIFI_PASSWORD "%s"\n' "$WIFI_SSID" "$WIFI_PASSWORD" > solutions/videopuerto/main/settings.h
          printf '#pragma once\n#define TG_TOKEN "%s"\n#define TG_CHAT_ID "%s"\n#define DOORBELL_PEER_ID "%s"\n' "$TG_TOKEN" "$TG_CHAT_ID" "$PEER_ID" > solutions/videopuerto/main/secrets.h
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PEER_ID: ${{ secrets.DOORBELL_PEER_ID }}

      - name: Compilar
        run: |
          docker run --rm -e CONFIG=1 -e CFLAGS="-Wno-error=format" \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/solutions/videopuerto \
            espressif/idf:v5.4.4 bash -c '
              git config --global --add safe.directory /project
              . /opt/esp/idf/export.sh > /dev/null 2>&1
              idf.py build || {
                echo "########## ULTIMAS 50 LINEAS DEL LOG (stderr) ##########"
                tail -50 build/log/idf_py_stderr_output_* 2>/dev/null
                echo "########## ULTIMAS 50 LINEAS DEL LOG (stdout) ##########"
                tail -50 build/log/idf_py_stdout_output_* 2>/dev/null
                echo "########## ERRORES DETECTADOS ##########"
                grep -hE "error:|CMake Error|fatal error" build/log/idf_py_stderr_output_* build/log/idf_py_stdout_output_* 2>/dev/null | sort -u | head -40
                exit 1
              }
            '

      - name: Publicar Release
        run: |
          mkdir -p release
          cp $(ls solutions/videopuerto/build/*.bin | head -1) release/videopuerto.bin
          cp solutions/videopuerto/build/bootloader/bootloader.bin release/
          cp solutions/videopuerto/build/partition_table/partition-table.bin release/
          cp solutions/videopuerto/build/flash_args release/
          cd release
          gh release create "v$(tr -d '[:space:]' < ../solutions/videopuerto/version.txt)" videopuerto.bin bootloader.bin partition-table.bin flash_args --title "Videoportero" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
